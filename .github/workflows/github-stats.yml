name: Generate GitHub Stats

on:
  schedule:
    - cron: "5 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build
        working-directory: tools/github-stats
        run: zig build

      - name: Generate images
        run: |
          mkdir -p generated
          ./tools/github-stats/zig-out/bin/github-stats \
            --overview-output-file generated/overview.svg \
            --languages-output-file generated/languages.svg
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: Zig,HTML,CSS,Shell,Makefile,Java,Batchfile,PowerShell,Inno Setup
          EXCLUDE_PRIVATE: "false"
          EXCLUDE_INHERITED: "false"
          SILENT: "true"
          MAX_RETRIES: 5

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "chore: update generated stats"
          git push
